services:
  db:
    image: postgres:17
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5433:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      paperless-mq:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paperless
      DB_USER: paperless
      DB_PASSWORD: paperless

      SPRING_RABBITMQ_HOST: paperless-mq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: paperless-mq
      SPRING_RABBITMQ_PASSWORD: paperless-mq
      SPRING_RABBITMQ_VIRTUAL_HOST: paperless

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: paperless-min
      MINIO_SECRET_KEY: paperless-min
      MINIO_BUCKET: documents

      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8081:8081"

  web:
    build:
      context: ../paperless-web
      dockerfile: Dockerfile
    container_name: paperless-web
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "80:80"

  # --- Infrastructure: RabbitMQ (public image) -----------------------------------------------
  paperless-mq:
    image: rabbitmq:3-management-alpine
    container_name: paperless-mq-dc
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (guest:guest, but we override to paperless-mq/paperless-mq below)
    environment:
      RABBITMQ_DEFAULT_USER: paperless-mq
      RABBITMQ_DEFAULT_PASS: paperless-mq
      RABBITMQ_DEFAULT_VHOST: paperless
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl -q status || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-worker:
    build:
      context: ../ocr-worker
      dockerfile: Dockerfile
    container_name: paperless-ocr-worker
    restart: unless-stopped
    depends_on:
      paperless-mq:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: paperless-mq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: paperless-mq
      SPRING_RABBITMQ_PASSWORD: paperless-mq
      SPRING_RABBITMQ_VIRTUAL_HOST: paperless

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: paperless-min
      MINIO_SECRET_KEY: paperless-min
      MINIO_BUCKET: documents

      ELASTICSEARCH_URIS: http://elasticsearch:9200

  # --- Infrastructure: MinIO (Object Storage) ------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: paperless-min
      MINIO_ROOT_PASSWORD: paperless-min
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # --- Infrastructure: Elasticsearch (Volltextsuche) -----------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: paperless-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"   # REST API
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  paperless-db-data:
  minio-data:
  es-data: