services:
  db:
    image: postgres:17
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5433:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paperless
      DB_USER: paperless
      DB_PASSWORD: paperless
    ports:
      - "8081:8081"

  web:
    image: node:22
    container_name: paperless-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../paperless-web:/app
      - paperless-web-node-modules:/app/node_modules
    ports:
      - "80:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"

volumes:
  paperless-db-data:
  paperless-web-node-modules: