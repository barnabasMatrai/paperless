services:
  db:
    image: postgres:17
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5433:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paperless
      DB_USER: paperless
      DB_PASSWORD: paperless
    ports:
      - "8081:8081"

  web:
    build:
      context: ../paperless-web
      dockerfile: Dockerfile
    container_name: paperless-web
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "80:80"

  # --- Infrastructure: RabbitMQ (public image) -----------------------------------------------
  paperless-mq:
    image: rabbitmq:3-management-alpine
    container_name: paperless-mq-dc
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (guest:guest, but we override to paperless-mq/paperless-mq below)
    environment:
      RABBITMQ_DEFAULT_USER: paperless-mq
      RABBITMQ_DEFAULT_PASS: paperless-mq
      RABBITMQ_DEFAULT_VHOST: paperless
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl -q status || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paperless-db-data:



