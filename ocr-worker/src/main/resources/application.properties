spring.application.name=ocr-worker

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:paperless-mq}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:paperless-mq}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:paperless}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:paperless-min}
minio.secret-key=${MINIO_SECRET_KEY:paperless-min}
minio.bucket=${MINIO_BUCKET:documents}

ocr.datapath=${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
ocr.language=${OCR_LANGUAGE:deu+eng}
ocr.dpi=300

spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}