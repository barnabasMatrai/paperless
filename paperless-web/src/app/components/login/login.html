<div class="login-page">
  <main class="form-panel">
    <span class="shape shape--light-1"></span>
    <span class="shape shape--light-2"></span>

    <div class="login-card">
      <header class="card-header">
        <div class="logo-icon">
          <svg viewBox="0 0 48 60" aria-hidden="true">
            <path d="M6 0h26l16 16v38a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6z" fill="#1a6ef5"/>
            <path d="M32 0l16 16H36a4 4 0 0 1-4-4V0z" fill="#e8f0fe"/>
            <rect x="11" y="27" width="24" height="3" rx="1.5" fill="#fff"/>
            <rect x="11" y="35" width="24" height="3" rx="1.5" fill="#fff"/>
            <rect x="11" y="43" width="24" height="3" rx="1.5" fill="#fff"/>
          </svg>
        </div>
        <div>
          <h2 class="card-title">Paperless</h2>
          <p class="card-subtitle">Document Management System</p>
        </div>
      </header>

      <h3 class="welcome">Welcome back</h3>
      <p class="welcome-text">Sign in to access your documents.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper"
               [class.invalid]="username.invalid && username.touched">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>

            <input id="username"
                   type="text"
                   formControlName="username"
                   placeholder="Enter your username"
                   autocomplete="username" />
          </div>

          <small class="error" *ngIf="username.invalid && username.touched">
            Enter your username.
          </small>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper"
               [class.invalid]="password.invalid && password.touched">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              <circle cx="12" cy="16" r="1"/>
            </svg>

            <input id="password"
                   [type]="showPassword ? 'text' : 'password'"
                   formControlName="password"
                   placeholder="Enter your password"
                   autocomplete="current-password" />

            <button type="button"
                    class="toggle-password"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
                <path *ngIf="showPassword" d="m3 3 18 18"/>
              </svg>
            </button>
          </div>

          <small class="error" *ngIf="password.invalid && password.touched">
            Enter your password.
          </small>
        </div>

        <!-- Remember / Forgot -->
        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" formControlName="rememberMe" />
            <span class="checkmark"></span>
            Remember me
          </label>

          <a routerLink="/forgot-password" class="link">
            Forgot password?
          </a>
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          {{ loading ? 'Signing in…' : 'Login' }}

          <svg *ngIf="!loading" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>

      <footer class="card-footer">
        Don't have an account?
        <a routerLink="/register" class="link link--bold">Register</a>
      </footer>
    </div>
  </main>
</div>
